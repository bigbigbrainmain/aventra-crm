[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."daily-digest"]
  schedule = "0 18 * * 1-5"

# Runs every 20 min through the working day. Each run tops the day's new-email
# tally up toward OUTREACH_DAILY_TARGET; once the target is met the run exits
# immediately (no searching, no API spend). This is how "keep going until it
# has N leads" is achieved on a plan without long-running background functions.
[functions."auto-lead-gen"]
  schedule = "*/20 7-16 * * 1-5"
  timeout = 26

[functions."enrich-emails-directories"]
  schedule = "*/30 7-18 * * 1-5"
  timeout = 26

[functions."auto-followup"]
  schedule = "0 8,13 * * 1-5"
  timeout = 26

[functions."scheduled-send"]
  schedule = "0 * * * *"

[functions."lead-gen-score"]
  timeout = 26

[functions."backfill-emails"]
  timeout = 26

[functions."backfill-email-enrichment"]
  timeout = 26

[functions."backfill-reviews"]
  timeout = 26

[functions."lead-gen-emails"]
  timeout = 26

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
