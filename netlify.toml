[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."auto-lead-gen"]
  schedule = "0 7 * * 1-5"

[functions."auto-followup"]
  schedule = "0 8 * * 1-5"

[functions."scheduled-send"]
  schedule = "0 * * * *"

[functions."lead-gen-score"]
  timeout = 26

[functions."lead-gen-emails"]
  timeout = 26

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
