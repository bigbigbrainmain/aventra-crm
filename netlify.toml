[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions."auto-followup"]
  schedule = "0 8 * * *"

[functions."scheduled-send"]
  schedule = "0 * * * *"

[dev]
  command = "npm run dev"
  port = 8888
  targetPort = 5173
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
